<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">AI and software engineering workflow</title>
  <desc id="desc">A sequence from product problem through system design and evaluation to a working product.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="258" rx="24" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <text x="60" y="48" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="2">
    AI / SOFTWARE ENGINEERING
  </text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="650" text-anchor="middle">
    <rect x="55" y="78" width="230" height="82" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="170" y="128" fill="#f0f6fc">problem</text>

    <line x1="296" y1="119" x2="329" y2="119" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="340" y="78" width="230" height="82" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="455" y="128" fill="#f0f6fc">system</text>

    <line x1="581" y1="119" x2="614" y2="119" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="625" y="78" width="230" height="82" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="740" y="128" fill="#f0f6fc">evaluation</text>

    <line x1="866" y1="119" x2="899" y2="119" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="910" y="78" width="230" height="82" rx="14" fill="#0c2d48" stroke="#58a6ff" stroke-width="2"/>
    <text x="1025" y="128" fill="#79c0ff">product</text>
  </g>

  <text x="60" y="216" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
    product thinking · reliable ML · end-to-end delivery
  </text>
</svg>
